<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Blockers beat scores</title>
<desc id="d">A score bar showing 68.3 out of 100, above the 65 line for GO WITH CONDITIONS, but an open critical issue forces a NO-GO decision.</desc>
<rect width="1200" height="380" rx="14" fill="#0f172a"/>
<text x="600" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#f8fafc">Blockers beat scores: a 68.3 that still ends NO-GO</text>
<text x="600" y="64" text-anchor="middle" font-size="13" fill="#94a3b8">Example from the repo: a fictional app, with real tool output.</text>
<rect x="90" y="140" width="1020" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
<rect x="90" y="140" width="696.6600000000001" height="30" rx="6" fill="#2563eb"/>
<line x1="753.0" y1="126" x2="753.0" y2="184" stroke="#fbbf24" stroke-width="3" stroke-dasharray="5 4"/>
<text x="745.0" y="120" text-anchor="end" font-size="13" font-weight="700" fill="#fbbf24">65: line for GO WITH CONDITIONS</text>
<text x="796.6600000000001" y="161" font-size="14" font-weight="700" fill="#f8fafc">68.3</text>
<text x="90.0" y="198" text-anchor="middle" font-size="12" fill="#94a3b8">0</text>
<text x="600.0" y="198" text-anchor="middle" font-size="12" fill="#94a3b8">50</text>
<text x="1110.0" y="198" text-anchor="middle" font-size="12" fill="#94a3b8">100</text>
<text x="600" y="228" text-anchor="middle" font-size="14" fill="#e2e8f0">The score clears the line, but one open critical issue overrides it.</text>
<rect x="90" y="250" width="480" height="100" rx="12" fill="#111c33" stroke="#f87171" stroke-width="2"/>
<text x="106" y="278" font-size="15.5" font-weight="700" fill="#f87171">Open critical issue (S1)</text>
<text x="106" y="302" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="106" dy="0">• A session token is stored in clear text and written to the log</tspan></text>
<text x="106" y="325" font-size="13.5" fill="#e2e8f0" text-anchor="start" xml:space="preserve"><tspan x="106" dy="0">• A critical finding cannot be accepted away</tspan></text>
<path d="M586 300 L624 300 M612 288 L624 300 L612 312" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="640" y="250" width="470" height="100" rx="12" fill="#450a0a" stroke="#f87171" stroke-width="2.5"/>
<text x="875" y="312" text-anchor="middle" font-size="34" font-weight="800" fill="#fecaca">NO-GO</text>
<text x="875" y="336" text-anchor="middle" font-size="12.5" fill="#fca5a5">Keep the sprint open. A fix of about a day.</text>
</svg>
